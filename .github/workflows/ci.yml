name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Run tests
        run: python -m pytest
      - name: Reproduce full counterexample workflow
        if: matrix.python-version == '3.12'
        run: |
          python examples/de_silva_lautsch/verify_counterexample.py
          python examples/de_silva_lautsch/analyze_conjugation_groups.py
          python examples/de_silva_lautsch/exact_counterexample_witness.py
