[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clifford-hierarchy-conjugation-testing"
version = "0.3.0"
description = "Exact and numerical tools for studying conjugation groups in the Clifford hierarchy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxwell Marcus" }]
keywords = ["quantum-computing", "clifford-hierarchy", "symplectic-geometry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
exact = ["sympy>=1.12"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "sympy>=1.12",
]

[project.scripts]
verify-counterexample = "clifford_conjugation.de_silva_lautsch:main"

[project.urls]
Repository = "https://github.com/MaxwellMarcus/clifford-hierarchy-conjugation-testing"
Issues = "https://github.com/MaxwellMarcus/clifford-hierarchy-conjugation-testing/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=clifford_conjugation --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
